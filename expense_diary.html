<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pénzügyi Napló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --green-dark: #0d3325;
    --green-deep: #14432f;
    --green: #1a5638;
    --green-btn: #14432f;
    --green-btn-hover: #1a5638;
    --green-accent: #1f9d5b;
    --green-soft: #e7f2ec;
    --green-chip: #cfe8db;

    --page: #f1f3f1;
    --card: #ffffff;
    --text: #16241d;
    --muted: #6b7d73;
    --border: #e3e8e4;

    --danger: #e0483d;

    --cat-green: #1f9d5b;
    --cat-blue: #3b82f6;
    --cat-yellow: #eab308;
    --cat-pink: #ec4899;
    --cat-gray: #94a3a0;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font-ui);
    background: var(--page);
    min-height: 100vh;
    color: var(--text);
    padding: 0;
    line-height: 1.45;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--page);
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(160deg, var(--green-deep) 0%, var(--green-dark) 100%);
    color: #fff;
    padding: 22px 20px 26px;
    border-radius: 0 0 26px 26px;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  header p { font-size: 13px; opacity: 0.8; margin-top: 3px; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 16px 0;
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
  }
  .tab {
    flex: 1;
    padding: 11px 4px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: #e4eae6;
    color: var(--muted);
    border-radius: 12px;
    transition: background 0.15s, color 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tab .ic { font-size: 17px; }
  .tab.active { background: var(--green-deep); color: #fff; }

  .content { padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; animation: fade 0.2s; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }

  h2 { font-family: var(--font-display); font-size: 19px; margin-bottom: 14px; color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head h2 { margin-bottom: 0; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 18px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
    color: #fff;
    background: var(--green-btn);
    margin-bottom: 10px;
    min-height: 50px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { background: var(--green-btn-hover); }
  .btn.secondary { background: #e4eae6; color: var(--green-deep); }
  .btn.secondary:hover { background: #d7e0da; }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: #c53a30; }
  .btn-row { display: flex; gap: 10px; }

  /* ---------- Inputs ---------- */
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #45564d; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 14px 15px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 16px;
    margin-bottom: 14px;
    transition: border 0.15s;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: none; border-color: var(--green-accent); }

  /* ---------- Color picker ---------- */
  .color-picker { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .color-btn {
    flex: 1;
    min-width: 56px;
    padding: 11px 4px;
    border: 3px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    transition: transform 0.08s;
    line-height: 1.2;
  }
  .color-btn:active { transform: scale(0.94); }
  .color-btn.selected { border-color: var(--green-deep); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--green-deep); }
  .c-green { background: var(--cat-green); }
  .c-blue { background: var(--cat-blue); }
  .c-yellow { background: var(--cat-yellow); }
  .c-pink { background: var(--cat-pink); }
  .c-gray { background: var(--cat-gray); }

  /* ---------- Messages ---------- */
  .msg {
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    display: none;
  }
  .msg.show { display: block; animation: fade 0.2s; }
  .msg.success { background: var(--green-soft); color: var(--green-deep); }
  .msg.error { background: #fdeae8; color: #b3392f; }
  .msg.info { background: var(--green-soft); color: var(--green-deep); }

  /* ---------- Card base ---------- */
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 6px 20px rgba(13, 51, 37, 0.06);
    margin-bottom: 16px;
  }

  /* ---------- Hero summary (egyenleg + körgyűrű) ---------- */
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .hero-label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .hero-total { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .donut { position: relative; width: 104px; height: 104px; border-radius: 50%; flex-shrink: 0; }
  .donut::after {
    content: ""; position: absolute; inset: 13px; background: var(--card); border-radius: 50%;
  }
  .donut-center {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .donut-center b { font-size: 19px; font-weight: 800; }
  .donut-center span { font-size: 9.5px; color: var(--muted); font-weight: 600; max-width: 66px; }

  .hero-breakdown { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .bd-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .bd-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .bd-name { flex: 1; font-weight: 600; }
  .bd-count { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .bd-amount { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Expense list rows ---------- */
  .exp-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border-radius: 18px;
    margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(13, 51, 37, 0.05);
  }
  .exp-icon {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
  }
  .exp-info { flex: 1; min-width: 0; }
  .exp-name { font-weight: 700; font-size: 15px; word-break: break-word; }
  .exp-cat { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .exp-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .exp-amount { font-weight: 800; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .exp-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px;
    border: none; border-radius: 11px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #eef2ef;
  }
  .icon-btn.del { background: #fdeae8; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 44px 20px;
    font-size: 14px;
    background: var(--card);
    border-radius: 20px;
  }
  .empty .big { font-size: 42px; display: block; margin-bottom: 10px; }

  /* ---------- Categories ---------- */
  .cat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border-radius: 16px;
    margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(13, 51, 37, 0.05);
  }
  .cat-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
  .cat-name { flex: 1; font-weight: 600; }
  .cat-badge { font-size: 11px; color: var(--muted); background: #eef2ef; padding: 3px 10px; border-radius: 20px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13, 51, 37, 0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 22px;
    padding: 24px 20px;
    width: 100%;
    max-width: 420px;
    animation: pop 0.2s;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 16px; font-weight: 600; letter-spacing: -0.01em; }

  .hint { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 14px; }

  /* Egyéni színválasztó */
  .custom-color {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; margin-bottom: 16px;
    border: 1.5px dashed var(--border); border-radius: 14px;
  }
  .custom-color label { font-weight: 600; color: #45564d; }
  .custom-color input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 54px; height: 40px; padding: 0; margin: 0;
    border: 1.5px solid var(--border); border-radius: 10px; background: none; cursor: pointer;
  }
  .custom-color input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  .custom-color input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .custom-color input[type="color"]::-moz-color-swatch { border: none; border-radius: 7px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>💰 Pénzügyi Napló</h1>
    </div>
    <p>Kövesd a kiadásaidat egyszerűen</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-panel="manual"><span class="ic">✍️</span>Bevitel</button>
    <button class="tab" data-panel="list"><span class="ic">📊</span>Lista</button>
    <button class="tab" data-panel="categories"><span class="ic">⚙️</span>Kategóriák</button>
  </nav>

  <div class="content">

    <!-- ============ MANUAL PANEL ============ -->
    <section class="panel active" id="panel-manual">
      <h2>✍️ Új tétel</h2>
      <div class="msg" id="manualMsg"></div>

      <div class="card">
        <label for="mName">Tétel neve</label>
        <input type="text" id="mName" placeholder="pl. Bevásárlás, Lakbér..." autocomplete="off">

        <label for="mAmount">Összeg (Ft)</label>
        <input type="number" id="mAmount" placeholder="pl. 2500" inputmode="numeric">

        <label>Kategória</label>
        <div class="color-picker" id="manualColors"></div>

        <button class="btn" id="btnAddManual">➕ Hozzáadás</button>
        <p class="hint" style="margin:2px 0 0; text-align:center;">Tipp: a mezőkben <b>Enter</b> gyorsan hozzáad. A kategória megmarad a következő tételhez.</p>
      </div>
    </section>

    <!-- ============ LIST PANEL ============ -->
    <section class="panel" id="panel-list">
      <div id="summaryArea"></div>
      <div class="section-head">
        <h2>Tételek</h2>
      </div>
      <div id="expenseListArea"></div>
      <hr class="divider" id="clearDivider" style="display:none">
      <button class="btn danger" id="btnClearAll" style="display:none">🗑️ Az összes adat törlése</button>
    </section>

    <!-- ============ CATEGORIES PANEL ============ -->
    <section class="panel" id="panel-categories">
      <h2>⚙️ Kategóriák</h2>
      <div class="msg" id="catMsg"></div>
      <div id="catListArea"></div>

      <hr class="divider">
      <h2>➕ Új kategória</h2>
      <div class="card">
        <label for="newCatName">Kategória neve</label>
        <input type="text" id="newCatName" placeholder="pl. Sport, Utazás..." autocomplete="off">
        <label>Szín</label>
        <div class="color-picker" id="newCatColors"></div>
        <div class="custom-color">
          <label for="newCatCustom" style="margin:0;">Egyéni szín</label>
          <input type="color" id="newCatCustom" value="#1f9d5b">
        </div>
        <button class="btn" id="btnAddCat">✨ Kategória létrehozása</button>
      </div>
    </section>

  </div>
</div>

<!-- ============ EDIT MODAL ============ -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ Tétel szerkesztése</h3>
    <label for="editName">Tétel neve</label>
    <input type="text" id="editName" autocomplete="off">
    <label for="editAmount">Összeg (Ft)</label>
    <input type="number" id="editAmount" inputmode="numeric">
    <label>Kategória</label>
    <div class="color-picker" id="editColors"></div>
    <div class="btn-row">
      <button class="btn" id="btnSaveEdit">💾 Mentés</button>
      <button class="btn secondary" id="btnCancelEdit">Mégse</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   PÉNZÜGYI NAPLÓ - mélyzöld dizájn, kézi bevitel
   ========================================================= */

const DEFAULT_CATEGORIES = {
  green:  { name: "Számlák",         color: "green"  },
  blue:   { name: "Étkezés",         color: "blue"   },
  yellow: { name: "Vállalkozás",     color: "yellow" },
  pink:   { name: "Impulzív kiadás", color: "pink"   },
  gray:   { name: "Egyéb",           color: "gray"   }
};

const COLOR_HEX = {
  green: "#1f9d5b", blue: "#3b82f6", yellow: "#eab308", pink: "#ec4899", gray: "#94a3a0"
};

// Választható színek új kategóriákhoz (alap 5 + továbbiak). Az érték HEX.
const PRESET_COLORS = [
  { name: "Zöld",      hex: "#1f9d5b" },
  { name: "Kék",       hex: "#3b82f6" },
  { name: "Sárga",     hex: "#eab308" },
  { name: "Rózsaszín", hex: "#ec4899" },
  { name: "Szürke",    hex: "#94a3a0" },
  { name: "Türkiz",    hex: "#14b8a6" },
  { name: "Indigó",    hex: "#6366f1" },
  { name: "Lila",      hex: "#a855f7" },
  { name: "Narancs",   hex: "#f97316" },
  { name: "Piros",     hex: "#ef4444" },
  { name: "Lime",      hex: "#84cc16" },
  { name: "Égszín",    hex: "#0ea5e9" },
  { name: "Barna",     hex: "#b45309" },
  { name: "Sötétzöld", hex: "#0d3325" }
];

// Fekete vagy fehér szöveg a háttérszínhez (kontraszt)
function textOn(hex) {
  if (!hex || hex[0] !== "#") return "#ffffff";
  const h = hex.length === 4
    ? hex.slice(1).split("").map(c => c + c).join("")
    : hex.slice(1);
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 165 ? "#1f2937" : "#ffffff";
}

let expenseItems = [];
let customCategories = {};
let editIndex = null;

/* ---------- LocalStorage ---------- */
function loadData() {
  try { const e = localStorage.getItem("expenseItems"); expenseItems = e ? JSON.parse(e) : []; }
  catch { expenseItems = []; }
  try { const c = localStorage.getItem("customCategories"); customCategories = c ? JSON.parse(c) : {}; }
  catch { customCategories = {}; }
}
function saveItems() { try { localStorage.setItem("expenseItems", JSON.stringify(expenseItems)); } catch {} }
function saveCategories() { try { localStorage.setItem("customCategories", JSON.stringify(customCategories)); } catch {} }

/* ---------- Kategória segédek ---------- */
function allCategories() { return Object.assign({}, DEFAULT_CATEGORIES, customCategories); }
function catName(key) { const c = allCategories(); return c[key] ? c[key].name : key; }
function catHex(key) {
  const c = allCategories();
  const col = c[key] ? c[key].color : key;
  if (typeof col === "string" && col[0] === "#") return col; // egyéni HEX szín
  return COLOR_HEX[col] || "#94a3a0";                        // alap színnév
}
function formatFt(n) { return new Intl.NumberFormat("hu-HU").format(Math.round(n)) + " Ft"; }

/* ---------- Üzenetek ---------- */
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg show " + type;
  clearTimeout(el._t);
  if (type !== "info") el._t = setTimeout(() => { el.className = "msg " + type; }, 3000);
}

/* ---------- Tabok ---------- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.panel).classList.add("active");
    if (tab.dataset.panel === "list") renderList();
    if (tab.dataset.panel === "categories") renderCategories();
    if (tab.dataset.panel === "manual") document.getElementById("mName").focus();
  });
});

/* ---------- Színválasztó ---------- */
function buildColorPicker(containerId, initial, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  const cats = allCategories();
  Object.keys(cats).forEach(key => {
    const c = cats[key];
    const btn = document.createElement("div");
    btn.className = "color-btn";
    btn.style.background = catHex(key);
    btn.style.color = textOn(catHex(key));
    btn.dataset.key = key;
    btn.textContent = c.name;
    if (key === initial) btn.classList.add("selected");
    btn.addEventListener("click", () => {
      container.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      if (onSelect) onSelect(key);
    });
    container.appendChild(btn);
  });
}
function getPickerValue(containerId) {
  const sel = document.querySelector("#" + containerId + " .color-btn.selected");
  return sel ? sel.dataset.key : null;
}

/* ---------- Duplikátum ---------- */
function isDuplicate(name, amount, color, ignoreIndex) {
  const n = name.trim().toLowerCase();
  return expenseItems.some((it, i) => {
    if (i === ignoreIndex) return false;
    return it.name.trim().toLowerCase() === n && Number(it.amount) === Number(amount) && it.color === color;
  });
}

/* ---------- Kézi bevitel ---------- */
function addExpense(name, amount, color) {
  name = (name || "").trim();
  amount = Number(amount);
  if (!name) return { ok: false, reason: "A tétel neve kötelező." };
  if (!amount || amount <= 0 || isNaN(amount)) return { ok: false, reason: "Adj meg érvényes összeget." };
  if (!color) return { ok: false, reason: "Válassz kategóriát." };
  if (isDuplicate(name, amount, color)) return { ok: false, reason: "Ez a tétel már létezik (duplikátum)." };
  expenseItems.push({ name, amount, color });
  saveItems();
  return { ok: true };
}

function submitManual() {
  const nameEl = document.getElementById("mName");
  const amountEl = document.getElementById("mAmount");
  const name = nameEl.value;
  const amount = amountEl.value;
  const color = getPickerValue("manualColors");
  const res = addExpense(name, amount, color);
  if (res.ok) {
    showMsg("manualMsg", `✅ Hozzáadva: ${name.trim()} – ${formatFt(amount)}  (összesen ${expenseItems.length} tétel)`, "success");
    nameEl.value = ""; amountEl.value = ""; nameEl.focus();
  } else {
    showMsg("manualMsg", "⚠️ " + res.reason, "error");
  }
}
document.getElementById("btnAddManual").addEventListener("click", submitManual);
document.getElementById("mName").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("mAmount").focus(); }
});
document.getElementById("mAmount").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitManual(); }
});

/* ---------- Lista / összesítés ---------- */
function renderList() {
  const summaryArea = document.getElementById("summaryArea");
  const listArea = document.getElementById("expenseListArea");

  if (expenseItems.length === 0) {
    summaryArea.innerHTML = "";
    listArea.innerHTML = '<div class="empty"><span class="big">📭</span>Még nincs egyetlen tétel sem.<br>Vidd fel az elsőt a Bevitel fülön!</div>';
    document.getElementById("btnClearAll").style.display = "none";
    document.getElementById("clearDivider").style.display = "none";
    return;
  }

  const totals = {};
  let grand = 0;
  expenseItems.forEach(it => {
    if (!totals[it.color]) totals[it.color] = { sum: 0, count: 0 };
    totals[it.color].sum += Number(it.amount);
    totals[it.color].count++;
    grand += Number(it.amount);
  });

  // körgyűrű (conic-gradient) + legnagyobb kategória a közepén
  const entries = Object.keys(totals).map(k => ({ key: k, sum: totals[k].sum, count: totals[k].count }));
  entries.sort((a, b) => b.sum - a.sum);

  let acc = 0;
  const stops = entries.map(e => {
    const start = (acc / grand) * 100;
    acc += e.sum;
    const end = (acc / grand) * 100;
    return `${catHex(e.key)} ${start}% ${end}%`;
  }).join(", ");

  const top = entries[0];
  const topPct = Math.round((top.sum / grand) * 100);

  let bd = "";
  entries.forEach(e => {
    bd += `
      <div class="bd-row">
        <span class="bd-dot" style="background:${catHex(e.key)}"></span>
        <span class="bd-name">${escapeHtml(catName(e.key))}</span>
        <span class="bd-count">${e.count} db</span>
        <span class="bd-amount">${formatFt(e.sum)}</span>
      </div>`;
  });

  summaryArea.innerHTML = `
    <div class="card">
      <div class="hero-top">
        <div>
          <div class="hero-label">Összes kiadás</div>
          <div class="hero-total">${formatFt(grand)}</div>
          <div class="hero-sub">${expenseItems.length} tétel · ${entries.length} kategória</div>
        </div>
        <div class="donut" style="background:conic-gradient(${stops})">
          <div class="donut-center">
            <b>${topPct}%</b>
            <span>${escapeHtml(catName(top.key))}</span>
          </div>
        </div>
      </div>
      <div class="hero-breakdown">${bd}</div>
    </div>`;

  let lHtml = "";
  for (let i = expenseItems.length - 1; i >= 0; i--) {
    const it = expenseItems[i];
    lHtml += `
      <div class="exp-item">
        <div class="exp-icon" style="background:${catHex(it.color)}">💸</div>
        <div class="exp-info">
          <div class="exp-name">${escapeHtml(it.name)}</div>
          <div class="exp-cat">${escapeHtml(catName(it.color))}</div>
        </div>
        <div class="exp-right">
          <span class="exp-amount">${formatFt(it.amount)}</span>
          <div class="exp-actions">
            <button class="icon-btn edit" data-edit="${i}" title="Szerkesztés">✏️</button>
            <button class="icon-btn del" data-del="${i}" title="Törlés">🗑️</button>
          </div>
        </div>
      </div>`;
  }
  listArea.innerHTML = lHtml;

  listArea.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openEdit(Number(b.dataset.edit))));
  listArea.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => deleteExpense(Number(b.dataset.del))));

  document.getElementById("btnClearAll").style.display = "block";
  document.getElementById("clearDivider").style.display = "block";
}

function deleteExpense(i) {
  const it = expenseItems[i];
  if (!it) return;
  if (confirm(`Biztosan törlöd ezt a tételt?\n\n"${it.name}" – ${formatFt(it.amount)}`)) {
    expenseItems.splice(i, 1);
    saveItems();
    renderList();
  }
}
document.getElementById("btnClearAll").addEventListener("click", () => {
  if (confirm("⚠️ Biztosan törlöd az ÖSSZES tételt?\n\nEz a művelet nem vonható vissza!")) {
    expenseItems = [];
    saveItems();
    renderList();
  }
});

/* ---------- Szerkesztés modal ---------- */
function openEdit(i) {
  const it = expenseItems[i];
  if (!it) return;
  editIndex = i;
  document.getElementById("editName").value = it.name;
  document.getElementById("editAmount").value = it.amount;
  buildColorPicker("editColors", it.color);
  document.getElementById("editModal").classList.add("show");
}
function closeEdit() { document.getElementById("editModal").classList.remove("show"); editIndex = null; }
document.getElementById("btnCancelEdit").addEventListener("click", closeEdit);
document.getElementById("editModal").addEventListener("click", (e) => { if (e.target.id === "editModal") closeEdit(); });
document.getElementById("btnSaveEdit").addEventListener("click", () => {
  if (editIndex === null) return;
  const name = document.getElementById("editName").value.trim();
  const amount = Number(document.getElementById("editAmount").value);
  const color = getPickerValue("editColors");
  if (!name) { alert("A tétel neve kötelező."); return; }
  if (!amount || amount <= 0) { alert("Adj meg érvényes összeget."); return; }
  if (!color) { alert("Válassz kategóriát."); return; }
  if (isDuplicate(name, amount, color, editIndex)) { alert("Ez a módosítás egy már létező tétellel egyezne (duplikátum)."); return; }
  expenseItems[editIndex] = { name, amount, color };
  saveItems();
  closeEdit();
  renderList();
});

/* ---------- Kategóriák ---------- */
function renderCategories() {
  const area = document.getElementById("catListArea");
  const cats = allCategories();
  let html = "";
  Object.keys(cats).forEach(key => {
    const c = cats[key];
    const isCustom = !DEFAULT_CATEGORIES[key];
    html += `
      <div class="cat-item">
        <div class="cat-dot" style="background:${catHex(key)}"></div>
        <div class="cat-name">${escapeHtml(c.name)}</div>
        ${isCustom
          ? `<button class="icon-btn del" data-delcat="${key}" title="Törlés">🗑️</button>`
          : `<span class="cat-badge">alap</span>`}
      </div>`;
  });
  area.innerHTML = html;
  area.querySelectorAll("[data-delcat]").forEach(b => b.addEventListener("click", () => deleteCategory(b.dataset.delcat)));

  const container = document.getElementById("newCatColors");
  container.innerHTML = "";
  PRESET_COLORS.forEach((col, idx) => {
    const btn = document.createElement("div");
    btn.className = "color-btn";
    btn.style.background = col.hex;
    btn.style.color = textOn(col.hex);
    btn.dataset.color = col.hex;
    btn.textContent = col.name;
    if (idx === 0) btn.classList.add("selected");
    btn.addEventListener("click", () => {
      container.querySelectorAll(".color-btn").forEach(x => x.classList.remove("selected"));
      btn.classList.add("selected");
    });
    container.appendChild(btn);
  });
}

// Az új kategória kiválasztott színe: preset gomb, vagy ha egyik sincs kijelölve, az egyéni színválasztó
function getNewCatColor() {
  const sel = document.querySelector("#newCatColors .color-btn.selected");
  if (sel) return sel.dataset.color;
  return document.getElementById("newCatCustom").value;
}

function deleteCategory(key) {
  const c = customCategories[key];
  if (!c) return;
  const used = expenseItems.filter(it => it.color === key).length;
  let msg = `Biztosan törlöd a(z) "${c.name}" kategóriát?`;
  if (used > 0) msg += `\n\n⚠️ ${used} tétel használja ezt a kategóriát – azok is törlődnek!`;
  if (confirm(msg)) {
    delete customCategories[key];
    saveCategories();
    if (used > 0) { expenseItems = expenseItems.filter(it => it.color !== key); saveItems(); }
    renderCategories();
    const cur = getPickerValue("manualColors");
    buildColorPicker("manualColors", allCategories()[cur] ? cur : "green");
  }
}

document.getElementById("btnAddCat").addEventListener("click", () => {
  const name = document.getElementById("newCatName").value.trim();
  const color = getNewCatColor();
  if (!name) { showMsg("catMsg", "⚠️ Add meg a kategória nevét.", "error"); return; }
  if (!color) { showMsg("catMsg", "⚠️ Válassz színt.", "error"); return; }
  const exists = Object.values(allCategories()).some(c => c.name.trim().toLowerCase() === name.toLowerCase());
  if (exists) { showMsg("catMsg", "⚠️ Ilyen nevű kategória már létezik.", "error"); return; }
  const key = "custom_" + Date.now();
  customCategories[key] = { name, color };
  saveCategories();
  document.getElementById("newCatName").value = "";
  renderCategories();
  buildColorPicker("manualColors", getPickerValue("manualColors") || "green");
  showMsg("catMsg", "✅ Kategória létrehozva!", "success");
});

/* ---------- Segéd ---------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------- Indítás ---------- */
function init() {
  loadData();
  buildColorPicker("manualColors", "green");
  renderList();
  renderCategories();
  // Egyéni szín kiválasztásakor a preset gombok kijelölése törlődik
  document.getElementById("newCatCustom").addEventListener("input", () => {
    document.querySelectorAll("#newCatColors .color-btn").forEach(x => x.classList.remove("selected"));
  });
  document.getElementById("mName").focus();
}
init();
</script>
</body>
