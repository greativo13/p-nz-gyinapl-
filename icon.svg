<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pénzügyi Napló logó">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a5638"/>
      <stop offset="1" stop-color="#0d3325"/>
    </linearGradient>
  </defs>

  <!-- háttér -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- napló lap -->
  <rect x="116" y="152" width="280" height="248" rx="30" fill="#ffffff"/>

  <!-- spirál kötés -->
  <g fill="#0d3325">
    <rect x="150" y="128" width="18" height="54" rx="9"/>
    <rect x="219" y="128" width="18" height="54" rx="9"/>
    <rect x="288" y="128" width="18" height="54" rx="9"/>
    <rect x="344" y="128" width="18" height="54" rx="9"/>
  </g>

  <!-- alapvonal -->
  <line x1="150" y1="360" x2="360" y2="360" stroke="#e3e8e4" stroke-width="8" stroke-linecap="round"/>

  <!-- növekedési görbe -->
  <polyline points="152,350 214,302 278,280 340,220" fill="none" stroke="#1f9d5b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- adatpontok -->
  <circle cx="152" cy="350" r="10" fill="#ffffff" stroke="#1f9d5b" stroke-width="6"/>
  <circle cx="214" cy="302" r="10" fill="#ffffff" stroke="#1f9d5b" stroke-width="6"/>
  <circle cx="278" cy="280" r="10" fill="#ffffff" stroke="#1f9d5b" stroke-width="6"/>

  <!-- Ft érme a görbe végén -->
  <circle cx="340" cy="220" r="34" fill="#f5b301" stroke="#ffffff" stroke-width="9"/>
  <text x="340" y="232" font-size="34" font-weight="700" text-anchor="middle" fill="#7a4d00" font-family="Georgia, 'Times New Roman', serif">Ft</text>
</svg>
